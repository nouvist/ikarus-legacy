name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Electron App (Linux)
        run: |
          pnpm run make -p linux -a x64
          pnpm run package -p linux -a x64

      - name: Build Electron App (Windows)
        run: |
          pnpm run make -p win32 -a x64
          pnpm run package -p win32 -a x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-build
          path: ./out
